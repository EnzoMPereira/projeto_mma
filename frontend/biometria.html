<!DOCTYPE html>
<html lang= 'pt-BR'>
<head>
    <meta charset="UTF-8">
    <title>Autenticação Biométrica - MMA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="biometria">
    <div class="login-container">
        <h2>Verificação Biométrica</h2>
        <p id="welcome-message" style="color:#8a2be2; font-weight: bold;"> Confirmando identidade...</p>

        <!-- Área de Captura de Imagem Exigida-->
        <div class="biometrics-area">
            <video id="camera-feed" autoplay playsinline title = "Câmera Biométrica"></video>
            <p>posicione seu rosto na frente da câmera ou envie uma imagem</p>

        </div>

        <div class="file-upload-container">
            <input type="file" id="image-upload" accept="image/*"   >
            <button id="remove-image-btn" class="hidden" title="Remover imagem selecionada" style="background: transparent; color: #8a2be2; border: none; cursor: pointer; font-size: 22px; font-weight: bold; margin-left: 5px;">x</button>
        </div>

        <!--Área para tratamento de erros e exibição de nivel de acesso-->
        <div id="status-message" class="hidden"></div>
        <button id="auth-button" style="background-color: #8a2be2; color: white; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%;">Iniciar Autenticação</button>
    </div>
    <script src="script.js"></script>
</body>
</html>

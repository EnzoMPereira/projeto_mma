<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Portal Transparência - MMA </title>
    <link rel="stylesheet" href="style.css">
    <style>
        /*Estilos específicos para a Home para não quebrar as outras telas*/
        .home-container {
            text-align:center;
            max-width: 800px;
            padding: 40px;
            background-color: #1a1a1a;
            border: 2px solid #8a2be2;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.5);
            margin: 40px auto; /*Adicionado para centralizar a caixa*/
        }
        .home-container h1 {
            color: #8a2be2;
            margin-bottom: 10px;
        }
        .home-container p {
            font-size: 18px;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .btn {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-login {
            background-color: #8a2be2;
            color: white;
            border: none;
        }
        .btn-login:hover {
            background-color: #6a1b9a;
        }
        .btn-register {
            background-color: transparent;
            color: #8a2be2;
            border: 2px solid #8a2be2;
        }
        .btn-register:hover {
            background-color: #8a2be2;
            color: white;
        }
    </style>
</head>
<body>
    <div class="home-container">
        <h1>Ministério do Meio Ambiente</h1>
        <h2>Sistema de Financiamento Climático</h2>
        <p> Acesso restrito à base de dados de ações de mitigação e recursos nacionais e internacionais. O acesso exige autenticação biométrica de acordo com o nível hierárquico (Níveis 1, 2 e 3 ).</p>
        
        <div class="button-group">
            <!--Redirenciona para tela de login-->
            <a href="index.html" class="btn btn-login">Fazer Login</a>
            <!--Redirenciona para tela de cadastro-->
            <a href="cadastro.html" class="btn btn-register">Cadastrar Servidor</a>
        </div>
    </div>
</body>
</html>
